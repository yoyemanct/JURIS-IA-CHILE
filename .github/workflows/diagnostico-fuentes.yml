name: Diagnóstico de fuentes
on:
  push:
    branches: ["claude/**"]
    paths: ["fuentes/**", "scripts/probar-fuentes.js", ".github/workflows/diagnostico-fuentes.yml"]
  workflow_dispatch:
  # Cada lunes a las 9:00 (Chile): avisa si alguna fuente dejó de responder.
  schedule:
    - cron: "0 12 * * 1"
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Estado de la app publicada
        continue-on-error: true
        run: curl -sS -m 90 https://juris-ia-chile.vercel.app/api/fuentes | head -c 6000; echo
      - name: Estado de cuentas y cobro en la app publicada
        continue-on-error: true
        run: |
          for base in https://derechochileia.xyz https://juris-ia-chile.vercel.app; do
            echo "== $base"
            curl -sS -m 30 -o /tmp/c -w "HTTP %{http_code}\n" "$base/api/cuenta"; head -c 700 /tmp/c; echo
            curl -sS -m 30 -o /dev/null -w "Google: HTTP %{http_code} -> %{redirect_url}\n" "$base/api/cuenta/google" | cut -c1-160
            curl -sS -m 30 -o /tmp/c -w "Consulta sin cuenta: HTTP %{http_code}\n" -X POST "$base/api/consultar" -H 'Content-Type: application/json' -d '{"pregunta":"prueba de acceso"}'; head -c 200 /tmp/c; echo
            curl -sS -m 30 -o /tmp/c -w "Webhook (id inexistente): HTTP %{http_code}\n" -X POST "$base/api/pagos/webhook" -H 'Content-Type: application/json' -d '{"type":"subscription_preapproval","data":{"id":"diagnostico-inexistente"}}'; head -c 200 /tmp/c; echo
          done
      - name: Peticiones crudas a cada sitio
        continue-on-error: true
        run: |
          for u in "https://juris.pjud.cl/busqueda?Corte_Suprema" "https://buscador-backend.tcchile.cl/api/extended/sentencias?page=1&filter=%7B%22search%22%3A%22debido%20proceso%22%2C%22state%22%3Anull%2C%22dateRange%22%3Anull%7D" "https://www.contraloria.cl/appinf/LegisJuri/DictamenesGeneralesMunicipales.nsf/FormConsultaWeb2k?OpenForm&TextoLibre=feriado&Materia=Cualquiera&desde=1&porPagina=2&Orden=1&hpbb=SI" "https://api.crossref.org/works?query=despido&rows=1"; do
            echo "== $u"; curl -sS -m 40 -o /tmp/r -w "HTTP %{http_code} en %{time_total}s\n" -A "Mozilla/5.0" "$u"; head -c 400 /tmp/r; echo; done
      - name: Explorar datos abiertos de la BCN (¿hay sentencias?)
        continue-on-error: true
        run: |
          Q='SELECT ?c (COUNT(?s) AS ?n) WHERE { ?s a ?c . FILTER(REGEX(STR(?c), "entenc|urisprud|allo|ribunal|udicial", "i")) } GROUP BY ?c ORDER BY DESC(?n) LIMIT 30'
          curl -sS -m 60 -G "https://datos.bcn.cl/sparql" --data-urlencode "query=$Q" -H "Accept: application/sparql-results+json" | head -c 4000; echo
          Q2='SELECT DISTINCT ?p WHERE { ?s ?p ?o . FILTER(REGEX(STR(?p), "urisprud|entenc|allo", "i")) } LIMIT 30'
          curl -sS -m 60 -G "https://datos.bcn.cl/sparql" --data-urlencode "query=$Q2" -H "Accept: application/sparql-results+json" | head -c 3000; echo
      - name: Conectores de la app
        run: node scripts/probar-fuentes.js
