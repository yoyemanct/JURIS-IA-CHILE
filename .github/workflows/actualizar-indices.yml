name: Actualizar índices de jurisprudencia
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["scripts/actualizar-indice-dt.js", "fuentes/jurisprudencia/direcciontrabajo.js", ".github/workflows/actualizar-indices.yml"]
  # Cada domingo a las 4:00 (Chile).
  schedule:
    - cron: "0 7 * * 0"
permissions:
  contents: write
jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Índice de dictámenes de la Dirección del Trabajo
        run: node scripts/actualizar-indice-dt.js
      - name: Guardar si cambió
        run: |
          git config user.name "Derecho Chile IA (índices)"
          git config user.email "actions@users.noreply.github.com"
          git add data/indices
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualiza el índice de dictámenes de la Dirección del Trabajo"
          git push
